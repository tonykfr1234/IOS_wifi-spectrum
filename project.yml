name: WifiSpectrum
options:
  bundleIdPrefix: com.wifispectrum
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hant
packages:
  WifiSpectrumCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  WifiSpectrum:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: WifiSpectrumCore
    entitlements:
      path: App/WifiSpectrum.entitlements
      properties:
        com.apple.developer.networking.wifi-info: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Wi-Fi 頻譜分析儀
        CFBundleDevelopmentRegion: zh-Hant
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: iOS 規定要有位置權限，App 才能讀取目前連線的 Wi-Fi 名稱與基地台位址。App 不會讀取或儲存你的位置。
        NSLocalNetworkUsageDescription: 用來尋找同一個 Wi-Fi 網段中的裝置，並測試它們開啟的連接埠。
        NSBonjourServices:
          - _http._tcp
          - _ipp._tcp
          - _airplay._tcp
          - _raop._tcp
          - _smb._tcp
          - _ssh._tcp
          - _googlecast._tcp
          - _hap._tcp
          - _printer._tcp
          - _companion-link._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wifispectrum.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  WifiSpectrumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: WifiSpectrum
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wifispectrum.ios.tests
  WifiSpectrumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: WifiSpectrum
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wifispectrum.ios.uitests
schemes:
  WifiSpectrum:
    build:
      targets:
        WifiSpectrum: all
    test:
      gatherCoverageData: true
      targets:
        - WifiSpectrumTests
        - WifiSpectrumUITests
